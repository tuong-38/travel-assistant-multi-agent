services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travel_assistant
      POSTGRES_USER: travel_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_assistant -d travel_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://travel_assistant:${POSTGRES_PASSWORD:-local_only_change_me}@db:5432/travel_assistant
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

