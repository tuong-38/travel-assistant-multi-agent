services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.103.3
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travel_assistant
      POSTGRES_USER: travel_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_assistant -d travel_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  travel-tools-mcp:
    build: .
    command: ["/app/.venv/bin/python", "-m", "mcp_servers.travel_tools.server"]
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://travel_assistant:${POSTGRES_PASSWORD:-local_only_change_me}@db:5432/travel_assistant
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-}
      DEFAULT_MODEL: travel_general
      TRAVEL_TOOLS_MCP_URL: http://travel-tools-mcp:8001/mcp
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-5}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
      travel-tools-mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

